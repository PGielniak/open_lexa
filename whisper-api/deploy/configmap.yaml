apiVersion: v1
kind: ConfigMap
metadata:
  name: open-lexa-whisper-config
  labels:
    app.kubernetes.io/name: open-lexa-whisper
    app.kubernetes.io/component: stt
data:
  WHISPER_API_BIND: "0.0.0.0"
  WHISPER_API_PORT: "8080"
  # Model ids are an API contract label, not an OpenAI download. The image
  # bundles both Hailo HEFs; requests may pick either through the `model`
  # field, and `whisper-1` stays an alias for the default below.
  WHISPER_API_MODEL: "whisper-base"
  WHISPER_API_DEFAULT_MODEL: "whisper-base"
  WHISPER_API_MODELS: "whisper-base=/models/Whisper-Base.hef,whisper-small=/models/Whisper-Small.hef"
  WHISPER_API_LANGUAGE: "pl"
  WHISPER_API_QUEUE_SIZE: "4"
  WHISPER_API_REQUEST_TIMEOUT_SECONDS: "90"
  HAILO_VDEVICE_GROUP_ID: "SHARED"
  HAILO_WHISPER_TIMEOUT_MS: "15000"
  HAILO_WHISPER_CHUNK_SECONDS: "10"
  HAILO_WHISPER_NORMALIZE_PEAK: "0.9"
  HOME: "/tmp"
  HAILORT_LOGGER_PATH: "/tmp/hailort.log"

apiVersion: v1
kind: Secret
metadata:
  name: open-lexa-secrets
  labels:
    app.kubernetes.io/name: open-lexa
type: Opaque
stringData:
  # Must match RECEIVER_TOKEN in firmware/src/OpenLexaNano/Config.h.
  OPEN_LEXA_TOKEN: "replace-with-32-hex-characters"
  # Cloud STT API key. Required for STT_BACKEND=dual (default) and openai;
  # leave empty only when the ConfigMap uses STT_BACKEND=http (local only).
  OPENAI_API_KEY: "replace-with-an-openai-key"
  # Optional cloud base URL for dual/openai (defaults to api.openai.com/v1).
  # OPENAI_BASE_URL: "https://api.openai.com/v1"
  # Optional for STT_BACKEND=http. Use it for a cloud OpenAI-compatible URL;
  # leave absent for the in-cluster open-lexa-whisper Service.
  # STT_HTTP_API_KEY: "replace-with-a-cloud-provider-key"
  # Only with SMB_SERVER set in the ConfigMap.
  # SMB_USERNAME: "open-lexa"
  # SMB_PASSWORD: "replace-with-the-smb-password"
  # Only when the LLM NLU is on and the admin does not publish _config/llm.json
  # (receiver running without an SMB archive; see LLM_INTENT_MODE in the ConfigMap).
  # LLM_API_KEY: "replace-with-an-openai-key"

# uv workspace for the Python components; the firmware is built by firmware/build/arduino.sh.
[project]
name = "open-lexa-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "open-lexa",
    "open-lexa-admin",
    "open-lexa-whisper-api",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    # firmware/build/configure_arduino.py reads firmware/secrets.yaml.
    "pyyaml>=6,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["udp-receiver", "admin-dashboard", "whisper-api"]

[tool.uv.sources]
open-lexa = { workspace = true }
open-lexa-admin = { workspace = true }
open-lexa-whisper-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["udp-receiver/tests", "admin-dashboard/tests", "whisper-api/tests", "firmware/tests"]
# Test modules are imported by basename (test_commands_archive imports test_server),
# so test file names must stay unique across components.

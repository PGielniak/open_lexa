apiVersion: v1
kind: Service
metadata:
  name: open-lexa-llm
  labels:
    app.kubernetes.io/name: open-lexa-llm
    app.kubernetes.io/component: llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: open-lexa-llm
    app.kubernetes.io/component: llm
  ports:
    - name: http
      port: 8000
      # The tool-call adapter, which proxies everything else to hailo-ollama.
      targetPort: tools
      protocol: TCP

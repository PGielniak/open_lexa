apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Chat UI for the Hailo LLM, exposed on the tailnet only:
#   kubectl -n open-lexa create secret generic open-webui \
#     --from-literal=WEBUI_SECRET_KEY="$(openssl rand -hex 32)"   # once
#   kubectl apply -k open-webui/deploy
namespace: open-lexa
resources:
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: open-webui
    newName: ghcr.io/open-webui/open-webui
    newTag: v0.13.3
